services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprint
      POSTGRES_PASSWORD: sprint
      POSTGRES_DB: sprint_planning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint -d sprint_planning"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sprint:sprint@postgres:5432/sprint_planning
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./platform/app:/app/app
      - ./platform/templates:/app/templates
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  po-agent:
    build:
      context: ./agents/po-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME: po-agent
      AGENT_ROLE: PRODUCT_OWNER
      AGENT_PUBLIC_URL: http://po-agent:8001
      PLATFORM_URL: http://platform:8000
    ports:
      - "8001:8001"
    depends_on:
      - platform
    volumes:
      - ./agents/po-agent/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  dev-agent:
    build:
      context: ./agents/dev-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME: dev-agent
      AGENT_ROLE: DEVELOPER
      AGENT_PUBLIC_URL: http://dev-agent:8002
      PLATFORM_URL: http://platform:8000
      AGENT_CAPACITY_SP: "40"
      AGENT_SPECIALTIES: "backend,API,Python"
    ports:
      - "8002:8002"
    depends_on:
      - platform
    volumes:
      - ./agents/dev-agent/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  llm-po-agent:
    build:
      context: ./agents/llm-po-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME: llm-po-agent
      AGENT_ROLE: PRODUCT_OWNER
      AGENT_PUBLIC_URL: http://llm-po-agent:8011
      PLATFORM_URL: http://platform:8000
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8011:8011"
    depends_on:
      - platform

  llm-dev-agent:
    build:
      context: ./agents/llm-dev-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME: llm-dev-agent
      AGENT_ROLE: DEVELOPER
      AGENT_PUBLIC_URL: http://llm-dev-agent:8012
      PLATFORM_URL: http://platform:8000
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PERSONA_SPECIALTIES: backend,API,Python
      PERSONA_SENIORITY: senior
      AGENT_CAPACITY_SP: "15"
      AGENT_SPECIALTIES: "frontend,React,TypeScript"
    ports:
      - "8012:8012"
    depends_on:
      - platform

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      VITE_PLATFORM_URL: http://localhost:8000
      VITE_PROXY_URL: http://localhost:5174
      PROXY_TARGET: http://ui-proxy:5174
    ports:
      - "5173:5173"
    depends_on:
      - platform
      - ui-proxy
    volumes:
      - ./ui/src:/app/src
      - ./ui/index.html:/app/index.html
    command: bun run dev -- --host 0.0.0.0

  ui-proxy:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      PROXY_PORT: "5174"
      PROXY_PUBLIC_URL: http://ui-proxy:5174
      PLATFORM_URL: http://platform:8000
    ports:
      - "5174:5174"
    depends_on:
      - platform
    volumes:
      - ./ui/server:/app/server
    command: bun run server/index.ts

volumes:
  postgres_data:

